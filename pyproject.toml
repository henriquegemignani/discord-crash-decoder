[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "discord-crash-decoder"
version = "0.1.0"
description = "Decode Metroid Prime and Echoes crash screenshots"
requires-python = ">=3.12"
dependencies = [
  "discord.py>=2.5,<3", "httpx>=0.28,<1", "Pillow>=11,<13",
  "pytesseract>=0.3.13,<0.4", "PyYAML>=6,<7", "multi-demangle>=0.3,<2",
]

[project.scripts]
crash-decoder = "crash_decoder.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/crash_decoder"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
