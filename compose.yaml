services:
  decoder:
    build: .
    image: ${DECODER_IMAGE:-discord-crash-decoder:local}
    restart: unless-stopped
    init: true
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN:?Set DISCORD_TOKEN in .env}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
      OCR_WORKERS: ${OCR_WORKERS:-2}
      QUEUE_CAPACITY: ${QUEUE_CAPACITY:-8}
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    cpus: 2
    pids_limit: 128
