name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Lint, tests and container checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.13'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run crash-decoder symbols validate
      - name: Build test container
        run: docker build --target test -t crash-decoder:test .
      - name: Tests including real screenshot OCR
        run: docker run --rm crash-decoder:test
      - name: Build production container
        run: docker build -t crash-decoder:ci .
      - name: Non-root production OCR smoke test
        run: >-
          docker run --rm --read-only --tmpfs /tmp:size=256m
          --entrypoint python
          -v "$PWD/tests:/app/tests:ro" -v "$PWD/scripts:/app/scripts:ro"
          crash-decoder:ci /app/scripts/smoke.py
      - name: Symbol update, image upgrade and rollback cycle
        run: uv run python scripts/verify_update_cycle.py
